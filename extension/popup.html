<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .container {
            padding: 20px;
        }
        h1 {
            color: white;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .content {
            background: white;
            border-radius: 8px;
            padding: 15px;
        }
        .search-box {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.98);
        }
        .results {
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        .paper {
            background: #f5f5f5;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 4px solid #667eea;
        }
        .paper-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .paper-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
        }
        .score {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: 600;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }
        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }
        .status.error {
            background: #ffebee;
            color: #d32f2f;
        }
        .settings {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
        }
        input[type="number"] {
            width: 60px;
        }
        .footer {
            font-size: 11px;
            color: #999;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Research Paper Finder</h1>
        <div class="content">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Enter research topic..." value="ruimtelijke ordening">
            </div>
            <button id="searchBtn">🔍 Search Papers</button>
            <button id="analyzePageBtn">📖 Analyze This Page</button>
            
            <div id="status"></div>
            
            <div class="results" id="results"></div>
            
            <div class="settings">
                <div class="setting-row">
                    <label>Min Quality Score:</label>
                    <input type="number" id="qualitySlider" min="0" max="100" value="75">
                </div>
                <div class="setting-row">
                    <label>Max Results:</label>
                    <input type="number" id="maxResults" min="1" max="50" value="10">
                </div>
            </div>
            
            <div class="footer">
                Research Paper Finder v1.0
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
